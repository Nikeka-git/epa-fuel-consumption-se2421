[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fuel-consumption-se2421"
version = "0.1.0"
description = "Reproducible FuelEconomy.gov collection and EPA fuel-consumption regression"
requires-python = ">=3.11"
dependencies = ["numpy", "pandas", "pyarrow", "scikit-learn", "joblib", "matplotlib", "seaborn"]

[project.optional-dependencies]
dev = ["pytest", "nbformat", "nbconvert", "ipykernel"]
app = ["streamlit"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
